name: CI

# Runs when code changes, not for documentation. It can also be started by
# hand from the Actions tab.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the run for the older one pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      # Actions are pinned to full commit hashes; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install the pinned dependencies, checking their hashes
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.txt
      - name: Python tests
        run: python -m unittest discover -s tests
      - name: JavaScript tests
        run: node --test
